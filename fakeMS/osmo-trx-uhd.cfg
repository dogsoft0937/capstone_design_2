log stderr
 logging filter all 1
 logging color 1
 logging print category-hex 0
 logging print category 1
 logging timestamp 0
 logging print file basename last
 logging print level 1
 logging level set-all notice
!
line vty
 no login
!
cpu-sched
 policy rr 18
trx
 bind-ip 127.0.0.1
 remote-ip 127.0.0.1
 dev-args serial=33537CE
 base-port 6700
 egprs disable
 tx-sps 4
 rx-sps 4
 clock-ref internal
 chan 0
  tx-path TX/RX
  rx-path RX2
